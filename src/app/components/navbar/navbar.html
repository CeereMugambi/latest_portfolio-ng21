<header class="nav-wrap">
  <nav class="nav glass" [class.scrolled]="scrolled()">
    <a class="logo" routerLink="/"><span class="spark">✦</span> Ceere</a>
    <ul class="links" [class.open]="open()">
      @for (l of links; track l.path) {
        <li>
          <a
            [routerLink]="l.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="open.set(false)"
          >{{ l.label }}</a>
        </li>
      }
    </ul>

    <<button class="burger" [class.open]="open()" (click)="open.set(!open())" aria-label="Menu">
      <span></span><span></span>
    </button>
  </nav>
</header>
